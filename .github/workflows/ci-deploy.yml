name: CI + Deploy Node.js App to Azure Web App (Staging & Production)

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  # ============================================================
  # 🧪 JOB 1: CI - Test and Code Coverage
  # ============================================================
  ci-test:
    name: Run Tests and Upload Coverage
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Run tests (with coverage if applicable)
      - name: Run tests and generate coverage
        run: npm test -- --coverage || echo "No tests defined"

      # 5️⃣ Upload coverage to Codecov (optional)
      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # only needed for private repos
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false

  # ============================================================
  # 🚀 JOB 2: Deploy to Staging (runs after CI)
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: ci-test
    if: ${{ success() }}
    environment:
      name: staging

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies (optional if you build before deploying)
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Deploy to Azure Web App (Staging)
      - name: Deploy to Azure Web App - Staging
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'test20' # replace with your staging app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_STAGING }}
          package: '.'

  # ============================================================
  # 🌐 JOB 3: Deploy to Production (runs after staging)
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: ${{ success() }}
    environment:
      name: production

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Deploy to Azure Web App (Production)
      - name: Deploy to Azure Web App - Production
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'test20' # replace with your production app name
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: '.'
